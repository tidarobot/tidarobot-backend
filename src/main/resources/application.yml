spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tidarobot
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
jwt:
  secret: ${JWT_SECRET}
parking:
  days-before: 6
  trigger-hour: 16